name = "Bloblang"
grammar = "bloblang"
path_suffixes = ["blobl"]
line_comments = ["# "]
autoclose_before = ",)]}"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
